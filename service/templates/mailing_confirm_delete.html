<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Подтверждение удаления рассылки</title>
</head>
<body>
    <h1>Удалить рассылку "{{ object.message }}"?</h1>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'service:client_list' %}">Отмена</a>
    </form>
</body>
</html>
