<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Подтверждение удаления сообщения</title>
</head>
<body>
    <h1>Удалить сообщение "{{ object.topic }}"?</h1>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'service:messages_list' %}">Отмена</a>
    </form>
</body>
</html>
